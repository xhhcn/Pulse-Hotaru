services:
  pulse:
    image: xhh1128/pulse-hotaru:latest
    container_name: pulse-monitor
    ports:
      - 8008:8008
    volumes:
      - pulse-data:/app/data
    restart: unless-stopped
    # Docker's default grace period is 10 s, but supervisord gives the
    # backend 30 s (stopwaitsecs) to flush and close bbolt cleanly. Match
    # that plus slack so docker stop never SIGKILLs a half-written DB.
    stop_grace_period: 45s
volumes:
  pulse-data:

